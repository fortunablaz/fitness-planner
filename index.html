<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f14">
<title>Fitness Planner</title>
<style>
:root{
  --bg:#0b0d11;--panel:#12161d;--panel2:#171c24;--line:#252c37;
  --text:#f2f4f7;--muted:#9aa4b2;--accent:#c9a876;--green:#7bd88f;
  --red:#ff7777;--blue:#78a8ff;--shadow:0 18px 50px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% -10%,#252019 0,#0b0d11 35%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:250px;border-right:1px solid var(--line);background:rgba(13,16,21,.9);padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:10}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;padding:8px 10px 25px}
.brand span{color:var(--accent)}
.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 13px;text-align:left;border-radius:10px;margin:3px 0}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}
.sidebar .small{position:absolute;bottom:18px;left:22px;right:22px;color:#697382;font-size:11px}
.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:25px}
h1{margin:0;font-size:32px;letter-spacing:-1px}
.sub{color:var(--muted);margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px}
.btn:hover{border-color:#3a4350}
.btn.primary{background:var(--accent);color:#17120c;border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(180deg,#151a21,#11151b);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}
.kpi{font-size:29px;font-weight:800}.klabel{font-size:12px;color:var(--muted);margin-top:4px}
.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}
.client-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.client-card{cursor:pointer}.client-card:hover{border-color:#48515e;transform:translateY(-1px)}
.client-name{font-size:17px;font-weight:750}.meta{font-size:12px;color:var(--muted);margin-top:7px}.tag{display:inline-block;border:1px solid var(--line);padding:4px 7px;border-radius:999px;font-size:11px;color:#c9d0d9;margin:5px 4px 0 0}
.search{width:100%;padding:12px 13px;background:#0e1217;border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}
.search:focus{border-color:#536070}
.toolbar{display:flex;gap:10px;margin-bottom:13px}
.toolbar .search{max-width:480px}
table{width:100%;border-collapse:collapse}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:#aab4c1;font-weight:600;background:#10141a}tr:last-child td{border-bottom:0}
.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#1c2631;color:#b9d2ff}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#12161d;border:1px solid #303844;border-radius:17px;box-shadow:0 30px 90px rgba(0,0,0,.55);padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.close{background:transparent;border:0;color:var(--muted);font-size:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{background:#0d1116;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px}.field textarea{min-height:90px;resize:vertical}
.exercise-row{display:grid;grid-template-columns:1.5fr .8fr .7fr .7fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exercise-row:last-child{border-bottom:0}.exercise-row input,.exercise-row select{width:100%;background:#0d1116;border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px}
.chain{font-size:11px;color:var(--muted)}
.notice{padding:12px 14px;border:1px solid #3b3429;background:#1a1711;color:#d9c6a4;border-radius:10px;margin:12px 0}
.empty{padding:40px;text-align:center;color:var(--muted)}
.mobile-nav{display:none}
@media(max-width:950px){
 .sidebar{display:none}.main{margin-left:0;width:100%;padding:18px 14px 80px}.grid{grid-template-columns:repeat(2,1fr)}.client-grid{grid-template-columns:1fr}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#10141a;border-top:1px solid var(--line);z-index:20;padding:8px;gap:5px}
 .mobile-nav button{flex:1;background:transparent;border:0;color:var(--muted);padding:8px;font-size:11px}.mobile-nav button.active{color:var(--accent)}
 .top{align-items:flex-start}.top h1{font-size:25px}.form-grid{grid-template-columns:1fr}
}
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="brand">FITNESS <span>PLANNER</span></div>

      <button data-page="dashboard" class="active">⌂ &nbsp; Dashboard</button>

      <button data-page="exercises">◇ &nbsp; Baza vaj</button>
      <button data-page="generator">✦ &nbsp; Generator treninga</button>
    </nav>
    <div class="small">V1 · lokalna HTML različica<br>Podatki se shranjujejo v brskalnik.</div>
  </aside>

  <main class="main" id="app"></main>

  <nav class="mobile-nav">
    <button data-page="dashboard" class="active">⌂<br>Domov</button>
    <button data-page="clients">◉<br>Stranke</button>
    <button data-page="exercises">◇<br>Vaje</button>
    <button data-page="generator">✦<br>Generator</button>
  </nav>
</div>

const STORAGE_KEY = "fitness-planner-v1";

function loadDB(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved && saved.clients && saved.exercises) return saved;
  }catch(e){}
  return JSON.parse(JSON.stringify(INITIAL));
}
let db=loadDB();
let currentPage="dashboard";
let selectedClient=null;

function saveDB(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); }
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function setPage(p){currentPage=p; document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p)); render();}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));

function layout(title,sub,actions=""){
  return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`;
}

function render(){
  const root=document.getElementById("app");
  if(currentPage==="dashboard") root.innerHTML=dashboard();
  if(currentPage==="clients") root.innerHTML=clientsPage();
  if(currentPage==="exercises") root.innerHTML=exercisesPage();
  if(currentPage==="generator") root.innerHTML=generatorPage();
  bindPage();
}

function dashboard(){
  const notes=db.clients.filter(c=>c.notes).length;
  return layout("Dashboard","Pregled tvojega treningskega sistema",
    `<button class="btn primary" onclick="openClientModal()">+ Nova stranka</button>`) +
    `<div class="grid">
      <div class="card"><div class="kpi">${db.clients.length}</div><div class="klabel">Strank</div></div>
      <div class="card"><div class="kpi">${db.exercises.length}</div><div class="klabel">Vaj v bazi</div></div>
      <div class="card"><div class="kpi">${Object.values(db.history||{}).reduce((a,b)=>a+b.length,0)}</div><div class="klabel">Zabeleženih vaj</div></div>
      <div class="card"><div class="kpi">${notes}</div><div class="klabel">Strank z opombami</div></div>
    </div>
    <div class="section"><h2>Stranke</h2><div class="client-grid">${db.clients.slice(0,12).map(clientCard).join("")}</div></div>`;
}

function clientCard(c){
  return `<div class="card client-card" onclick='openClient(${JSON.stringify(c.name)})'>
    <div class="client-name">${esc(c.name)}</div>
    <div class="meta">${esc(c.frequency||"Frekvenca ni določena")} · ${esc(c.days.join(" / ")||"dnevi niso določeni")}</div>
    ${c.training3?`<span class="tag">${esc(c.training3)}</span>`:""}
    ${c.notes?`<span class="tag">⚑ opomba</span>`:""}
  </div>`;
}

function clientsPage(){
  return layout("Stranke","Upravljanje vseh strank",
    `<button class="btn primary" onclick="openClientModal()">+ Nova stranka</button>`) +
    `<div class="toolbar"><input id="clientSearch" class="search" placeholder="Išči stranko..." oninput="filterClients()"></div>
     <div id="clientList" class="client-grid">${db.clients.map(clientCard).join("")}</div>`;
}
function filterClients(){
  const q=document.getElementById("clientSearch").value.toLowerCase();
  document.getElementById("clientList").innerHTML=db.clients.filter(c=>(c.name+" "+c.notes+" "+c.goal).toLowerCase().includes(q)).map(clientCard).join("") || `<div class="empty">Ni zadetkov.</div>`;
}

function exercisesPage(){
  return layout("Baza vaj","Vse vaje iz tvojega Excela",
    `<button class="btn primary" onclick="openExerciseModal()">+ Nova vaja</button>`) +
    `<div class="toolbar"><input id="exerciseSearch" class="search" placeholder="Išči vajo ali verigo..." oninput="filterExercises()"></div>
     <div class="table-wrap"><table><thead><tr><th>Vaja</th><th>Veriga</th><th>Opomba</th></tr></thead><tbody id="exerciseList">
     ${db.exercises.map(exerciseRow).join("")}</tbody></table></div>`;
}
function exerciseRow(e){return `<tr><td><b>${esc(e.name)}</b></td><td><span class="badge">${esc(e.chain||"—")}</span></td><td>${esc(e.note||"")}</td></tr>`}
function filterExercises(){
  const q=document.getElementById("exerciseSearch").value.toLowerCase();
  document.getElementById("exerciseList").innerHTML=db.exercises.filter(e=>(e.name+" "+e.chain+" "+e.note).toLowerCase().includes(q)).map(exerciseRow).join("") || `<tr><td colspan="3" class="empty">Ni zadetkov.</td></tr>`;
}

function generatorPage(){
  const opts=db.clients.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("");
  return layout("Generator treninga","Predlog treninga na podlagi stranke, posebnosti in baze vaj",
    `<button class="btn" onclick="setPage('clients')">← Stranke</button>`) +
    `<div class="card">
      <div class="form-grid">
        <div class="field"><label>Stranka</label><select id="genClient" onchange="showGenClient()"><option value="">Izberi stranko...</option>${opts}</select></div>
        <div class="field"><label>Tip treninga</label><select id="genType"><option>Posteriorna</option><option>Anteriorna</option><option>Full body</option><option>Jedro & mobilnost</option></select></div>
        <div class="field full"><label>Posebnosti / današnja opomba</label><textarea id="genNote" placeholder="Npr. danes je utrujena, bolečina v križu, manjša obremenitev..."></textarea></div>
      </div>
      <div id="genClientInfo"></div>
      <button class="btn primary" style="margin-top:12px" onclick="generateWorkout()">✦ Generiraj trening</button>
    </div>
    <div id="generated" class="section"></div>`;
}
function showGenClient(){
  const name=document.getElementById("genClient").value;
  const c=db.clients.find(x=>x.name===name);
  document.getElementById("genClientInfo").innerHTML=c?`<div class="notice"><b>${esc(c.name)}</b> · ${esc(c.frequency||"")} · ${esc(c.days.join(" / "))}<br>${c.notes?`Posebnosti: ${esc(c.notes)}`:"Brez vpisanih posebnosti."}</div>`:"";
}
function generateWorkout(){
  const name=document.getElementById("genClient").value;
  const type=document.getElementById("genType").value;
  const note=document.getElementById("genNote").value;
  if(!name){alert("Najprej izberi stranko.");return;}
  const c=db.clients.find(x=>x.name===name);
  const hist=(db.history&&db.history[name]||[]).map(x=>x.exercise.toLowerCase());
  let pool=db.exercises.filter(e=>e.name && (!type || type==="Full body" || e.chain===type || (type==="Jedro & mobilnost" && /jedro|mobil/i.test(e.chain))));
  if(!pool.length) pool=db.exercises;
  // Simple non-AI v1 heuristic: prioritize exercises not used recently.
  pool.sort((a,b)=>(hist.includes(a.name.toLowerCase())?1:0)-(hist.includes(b.name.toLowerCase())?1:0));
  const chosen=[]; const chains=[];
  for(const e of pool){
    if(chosen.length>=7) break;
    if(!chains.includes(e.chain) || chosen.length<4){chosen.push(e);chains.push(e.chain);}
  }
  const sets=["3 × 10","3 × 12","4 × 8","3 × 10","3 × 12","2 × 12","2 × 30–45 s"];
  document.getElementById("generated").innerHTML=`<div class="card">
    <div class="modal-head"><div><h2 style="margin:0">${esc(name)} · ${esc(type)}</h2><div class="sub">${new Date().toLocaleDateString("sl-SI")}</div></div><button class="btn" onclick="window.print()">Natisni</button></div>
    ${c.notes||note?`<div class="notice">${c.notes?`<b>Profil:</b> ${esc(c.notes)}<br>`:""}${note?`<b>Danes:</b> ${esc(note)}`:""}</div>`:""}
    ${chosen.map((e,i)=>`<div class="exercise-row"><div><b>${esc(e.name)}</b><div class="chain">${esc(e.chain)}</div></div><input value="${sets[i]}"><input placeholder="Teža"><input placeholder="RPE"></div>`).join("")}
    <div class="actions" style="margin-top:15px"><button class="btn primary" onclick="alert('V1: tukaj bo kasneje shranjevanje treninga v bazo.')">Shrani trening</button></div>
  </div>`;
}

function openClient(name){selectedClient=name; openClientModal(name);}
function openClientModal(name=""){
  const c=db.clients.find(x=>x.name===name)||{name:"",goal:"",days:[],training3:"",frequency:"",notes:""};
  const back=document.createElement("div");back.className="modal-back";back.id="modal";
  back.innerHTML=`<div class="modal">
    <div class="modal-head"><h2 style="margin:0">${name?"Uredi stranko":"Nova stranka"}</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="form-grid">
      <div class="field"><label>Ime</label><input id="cName" value="${esc(c.name)}"></div>
      <div class="field"><label>Cilj</label><input id="cGoal" value="${esc(c.goal)}" placeholder="Moč, mišična masa, gibljivost..."></div>
      <div class="field"><label>Dnevi</label><input id="cDays" value="${esc(c.days.join(", "))}" placeholder="Ponedeljek, sreda"></div>
      <div class="field"><label>Frekvenca</label><input id="cFreq" value="${esc(c.frequency)}" placeholder="2× tedensko"></div>
      <div class="field"><label>Tip treninga</label><input id="cType" value="${esc(c.training3)}"></div>
      <div class="field full"><label>Posebnosti / omejitve / opombe</label><textarea id="cNotes">${esc(c.notes)}</textarea></div>
    </div>
    <div class="actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Prekliči</button><button class="btn primary" onclick='saveClient(${JSON.stringify(name)})'>Shrani</button></div>
  </div>`;
  document.body.appendChild(back);
}
function saveClient(oldName){
  const c={name:document.getElementById("cName").value.trim(),goal:document.getElementById("cGoal").value.trim(),days:document.getElementById("cDays").value.split(",").map(x=>x.trim()).filter(Boolean),frequency:document.getElementById("cFreq").value.trim(),training3:document.getElementById("cType").value.trim(),notes:document.getElementById("cNotes").value.trim()};
  if(!c.name){alert("Ime je obvezno.");return;}
  const idx=db.clients.findIndex(x=>x.name===oldName);
  if(idx>=0){db.clients[idx]=c;if(oldName!==c.name && db.history[oldName]){db.history[c.name]=db.history[oldName];delete db.history[oldName];}}
  else db.clients.push(c);
  saveDB();closeModal();render();
}
function openExerciseModal(){
  const back=document.createElement("div");back.className="modal-back";back.id="modal";
  back.innerHTML=`<div class="modal"><div class="modal-head"><h2 style="margin:0">Nova vaja</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="form-grid"><div class="field"><label>Naziv vaje</label><input id="eName"></div><div class="field"><label>Veriga</label><select id="eChain"><option>Posteriorna</option><option>Anteriorna</option><option>Jedro & Mobilnost</option></select></div><div class="field full"><label>Opomba</label><input id="eNote"></div></div>
  <div class="actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Prekliči</button><button class="btn primary" onclick="saveExercise()">Shrani</button></div></div>`;
  document.body.appendChild(back);
}
function saveExercise(){
  const name=document.getElementById("eName").value.trim(); if(!name)return;
  db.exercises.push({name,chain:document.getElementById("eChain").value,note:document.getElementById("eNote").value.trim()});
  saveDB();closeModal();render();
}
function closeModal(){document.getElementById("modal")?.remove();}

function bindPage(){ if(currentPage==="generator") showGenClient(); }
render();
</script>
</body>
</html>
